name: Build IPA (fork)

# フォークで「IPA を作って SideStore で入れる」ためだけのワークフロー。
#
# 本家の build.yml との違い:
#   - リリース処理を一切行わない (secrets 不要、権限不要)
#   - Xcode バージョンとランナーを workflow_dispatch から差し替えられる
#   - 失敗時に調査用アーティファクトを集める
#
# 成果物は 2 つ:
#   - LiveContainer.ipa            … 素の LiveContainer
#   - LiveContainer+SideStore.ipa  … SideStore を内蔵ゲストアプリとして同梱
#
# 同梱版は外部ダウンロード (dylibify / SideStore nightly) に依存するため、
# ネットワーク都合で落ちることがある。その場合でも素の IPA は先に
# アップロード済みになるよう、ステップの順序を分けてある。
#
# 手動実行: Actions タブ → "Build IPA (fork)" → Run workflow

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 使用するランナー (例 macos-26 / macos-15)
        type: string
        required: false
        default: macos-26
      xcode_version:
        description: 使用する Xcode (例 latest-stable / 26.2)
        type: string
        required: false
        default: latest-stable
      openssl_ref:
        description: OpenSSL サブモジュールの ref (空なら本家の固定コミットを自動解決)
        type: string
        required: false
        default: ''
      strict_xcframework_signature:
        description: XCFramework の署名が一致しない場合にビルドを中止する
        type: boolean
        required: false
        default: false
      build_sidestore:
        description: SideStore 同梱版もビルドする
        type: boolean
        required: false
        default: true
      compare_with_official:
        description: 同梱版を公式 nightly と構造比較する (調査用)
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      scheme: LiveContainer
      archive_path: archive

    steps:
      - name: Show available Xcode versions
        run: |
          echo "=== インストール済み Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "=== 既定の Xcode ==="
          xcodebuild -version

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version || 'latest-stable' }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # GitHub の「Download ZIP」で取得したツリーを push したリポジトリでは、
      # サブモジュールのディレクトリが**空のまま**になる (ZIP はサブモジュールを
      # 含まない)。その場合 `submodules: recursive` は何もしないので、
      # ここで実体を取りに行く。実フォークなら 1 行目で済む。
      #
      # OpenSSL は既定ブランチの最新を取ると、xcodeproj に記録された
      # expectedSignature と噛み合わなくなる。そこで本家が固定している
      # コミットを GitHub API で解決して、そのコミットを取得する。
      - name: Ensure submodules
        env:
          OPENSSL_REF: ${{ inputs.openssl_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git submodule update --init --recursive || true

          # 本家がサブモジュールとして固定している commit SHA を取得する
          resolve_upstream_sha() {
            path="$1"
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/LiveContainer/LiveContainer/contents/$path" \
            | jq -r 'if type == "object" and .type == "submodule" then .sha else empty end' \
              2>/dev/null || true
          }

          clone_at_sha() {
            dir="$1"; url="$2"; sha="$3"
            rm -rf "$dir"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            if git -C "$dir" fetch -q --depth 1 origin "$sha"; then
              git -C "$dir" checkout -q FETCH_HEAD
              echo "$dir: $sha を取得しました"
              return 0
            fi
            echo "$dir: $sha の取得に失敗しました"
            return 1
          }

          ensure() {
            dir="$1"; url="$2"; ref="$3"; upstream_path="$4"
            if [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "$dir: 取得済み"
              return
            fi
            echo "$dir: 空なので取得します"

            if [ -n "$ref" ]; then
              rm -rf "$dir"
              git clone -q --depth 1 --branch "$ref" "$url" "$dir"
              echo "$dir: 指定された ref '$ref' を取得しました"
              return
            fi

            sha="$(resolve_upstream_sha "$upstream_path")"
            if [ -n "$sha" ] && clone_at_sha "$dir" "$url" "$sha"; then
              return
            fi

            echo "$dir: 本家の固定コミットを解決できないため既定ブランチを取得します"
            rm -rf "$dir"
            git clone -q --depth 1 "$url" "$dir"
          }

          ensure OpenSSL  https://github.com/krzyzanowskim/OpenSSL   "$OPENSSL_REF" OpenSSL
          ensure litehook https://github.com/LiveContainer/litehook  "" litehook
          ensure fishhook https://github.com/LiveContainer/fishhook  "" fishhook

          echo "=== サブモジュールの確認 ==="
          for d in OpenSSL litehook fishhook; do
            printf '%-10s %s files\n' "$d" "$(find "$d" -type f 2>/dev/null | wc -l | tr -d ' ')"
          done

          if [ ! -d OpenSSL/Frameworks/OpenSSL.xcframework ]; then
            echo "::error::OpenSSL/Frameworks/OpenSSL.xcframework が見つかりません"
            ls -la OpenSSL 2>/dev/null || true
            ls -la OpenSSL/Frameworks 2>/dev/null || true
            exit 1
          fi
          echo "OpenSSL.xcframework を確認しました"

      # Xcode 15 以降は XCFramework の署名を検証する。
      # xcodeproj には
      #   expectedSignature = "AppleDeveloperProgram:67RAULRX93:Marcin Krzyzanowski"
      # が記録されており、取得した xcframework の署名がこれと違うと
      #   error: “OpenSSL.xcframework” is not signed with the expected identity
      # で落ちる。本家の固定コミットを取れていれば一致するはずだが、
      # 取れなかった場合に備えて実際の署名を照合し、食い違うときは
      # 記録側を外してビルドを通す (既定)。
      - name: Reconcile XCFramework signature
        env:
          STRICT: ${{ inputs.strict_xcframework_signature }}
        run: |
          PBX=LiveContainer.xcodeproj/project.pbxproj
          XCF=OpenSSL/Frameworks/OpenSSL.xcframework

          EXPECTED=$(grep -o 'expectedSignature = "[^"]*"' "$PBX" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$EXPECTED" ]; then
            echo "expectedSignature の記録がありません。検証をスキップします"
            exit 0
          fi
          EXPECTED_TEAM=$(echo "$EXPECTED" | cut -d: -f2)
          echo "期待される署名   : $EXPECTED"
          echo "期待されるチーム : $EXPECTED_TEAM"

          ACTUAL_TEAM=$(codesign -dvv "$XCF" 2>&1 \
            | awk -F= '/^TeamIdentifier=/{print $2}' | head -1)
          echo "実際のチーム     : ${ACTUAL_TEAM:-(署名なし)}"

          if [ "$ACTUAL_TEAM" = "$EXPECTED_TEAM" ]; then
            echo "署名が一致しました。検証を有効なまま進めます"
            exit 0
          fi

          echo "::warning::OpenSSL.xcframework の署名が期待値と一致しません " \
               "(期待 $EXPECTED_TEAM / 実際 ${ACTUAL_TEAM:-署名なし})"

          if [ "$STRICT" = "true" ]; then
            echo "::error::strict_xcframework_signature が有効なため中止します"
            exit 1
          fi

          echo "expectedSignature を xcodeproj から外してビルドを続行します"
          sed -i '' 's/expectedSignature = "[^"]*"; //g' "$PBX"
          if grep -q "expectedSignature" "$PBX"; then
            echo "::error::expectedSignature を除去できませんでした"
            exit 1
          fi
          echo "除去しました (このビルドのみ。リポジトリには影響しません)"

      # ビルド前に Info.plist の中身を確かめる。
      #   NSBonjourServices の Quick Share タイプ … 本家にマージ済み (念のため確認)
      #   NSAlarmKitUsageDescription             … このフォークの追加分
      # ここで AlarmKit のほうが落ちるなら、リベース時に追加が漏れている。
      - name: Verify Info.plist
        run: |
          PLIST=LiveContainer/Info.plist
          FAILED=0

          echo "=== NSBonjourServices (本家) ==="
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST"
          if /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST" \
              | grep -q "_FC9F5ED42C8A._tcp"; then
            echo "Quick Share のサービスタイプが含まれています"
          else
            echo "::error::_FC9F5ED42C8A._tcp が NSBonjourServices にありません"
            echo "本家にマージ済みのはずなので、ベースが古い可能性があります"
            FAILED=1
          fi

          echo "=== NSAlarmKitUsageDescription (フォークの追加分) ==="
          if /usr/libexec/PlistBuddy -c "Print :NSAlarmKitUsageDescription" "$PLIST" 2>/dev/null; then
            echo "AlarmKit の用途説明が含まれています"
          else
            echo "::error::NSAlarmKitUsageDescription が Info.plist にありません"
            FAILED=1
          fi

          exit $FAILED

      - name: Archive
        id: archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            2>&1 | tee xcodebuild.log | xcpretty && exit ${PIPESTATUS[0]}

      - name: Package LiveContainer.ipa
        run: sh .github/build_ipa_only.sh

      # 同梱版は外部ダウンロードに依存するので、素の IPA を先に確保しておく。
      # ここでアップロードしておけば、この後で落ちても成果物は残る。
      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-ipa
          path: ${{ env.scheme }}.ipa
          if-no-files-found: error

      - name: Package LiveContainer+SideStore.ipa
        if: ${{ inputs.build_sidestore != false }}
        run: sh .github/build_sidestore_ipa.sh

      # 出来上がった同梱版を、公式 nightly の同梱版と構造比較する。
      # 「自分のビルドだけ Refresh All Apps が失敗する」ようなときに、
      # どのファイルが欠けている / 余分なのかを特定するための材料。
      - name: Compare with official nightly
        if: ${{ inputs.build_sidestore != false && inputs.compare_with_official }}
        continue-on-error: true
        run: |
          mkdir -p compare/mine compare/official
          ( cd compare/mine && unzip -q "$GITHUB_WORKSPACE/$scheme+SideStore.ipa" )
          curl -fsSL -o compare/official.ipa \
            "https://github.com/LiveContainer/LiveContainer/releases/download/nightly/LiveContainer+SideStore.ipa"
          ( cd compare/official && unzip -q ../official.ipa )

          echo "=== バージョン ==="
          for d in mine official; do
            printf '%-9s %s\n' "$d" \
              "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                 compare/$d/Payload/LiveContainer.app/Info.plist)"
          done

          echo "=== _CodeSignature の数 ==="
          for d in mine official; do
            printf '%-9s %s\n' "$d" \
              "$(find compare/$d/Payload -type d -name _CodeSignature | wc -l | tr -d ' ')"
          done

          echo "=== マングル名 ==="
          for d in mine official; do
            echo "--- $d"
            strings compare/$d/Payload/LiveContainer.app/Metadata.appintents/extract.actionsdata \
              | grep -o '"mangledTypeNameV2":"[^"]*RefreshAll[^"]*"' | sort -u
          done

          echo "=== ファイル構成の差分 (自分にだけ無い / 余分) ==="
          ( cd compare/mine && find Payload -maxdepth 4 | sort ) > compare/mine.txt
          ( cd compare/official && find Payload -maxdepth 4 | sort ) > compare/official.txt
          diff compare/official.txt compare/mine.txt || true

      - name: Upload comparison
        if: ${{ inputs.build_sidestore != false && inputs.compare_with_official }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sidestore-comparison
          path: |
            compare/mine.txt
            compare/official.txt

      - name: Upload LiveContainer+SideStore.ipa
        if: ${{ inputs.build_sidestore != false }}
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-ipa
          path: ${{ env.scheme }}+SideStore.ipa
          if-no-files-found: error

      # --- 失敗時の調査用アーティファクト -------------------------------
      - name: Collect failure artifacts
        if: failure()
        run: |
          mkdir -p build-failure
          cp xcodebuild.log build-failure/ 2>/dev/null || true
          grep -E "error:|error :" xcodebuild.log > build-failure/errors.txt 2>/dev/null || true
          grep -E "warning:" xcodebuild.log > build-failure/warnings.txt 2>/dev/null || true
          {
            sw_vers
            echo "---"
            xcodebuild -version
            echo "---"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
          } > build-failure/environment.txt
          cp LiveContainer/Info.plist build-failure/ 2>/dev/null || true
          {
            echo "=== サブモジュールのファイル数 ==="
            for d in OpenSSL litehook fishhook; do
              printf '%-10s %s\n' "$d" "$(find "$d" -type f 2>/dev/null | wc -l | tr -d ' ')"
            done
          } > build-failure/submodules.txt 2>/dev/null || true
          {
            echo "=== IPA の生成状況 ==="
            ls -lh ./*.ipa 2>/dev/null || echo "(IPA なし)"
            echo "=== Payload の状態 ==="
            ls -la Payload/LiveContainer.app 2>/dev/null || echo "(Payload なし)"
            echo "=== SideStore 同梱の素材 ==="
            ls -la Payload/LiveContainer.app/Frameworks 2>/dev/null || true
            ls -la Payload/LiveContainer.app/PlugIns 2>/dev/null || true
            ls -lh tmp/SideStore.ipa 2>/dev/null || echo "(SideStore.ipa 未取得)"
            file dylibify 2>/dev/null || echo "(dylibify 未取得)"
          } > build-failure/packaging.txt 2>/dev/null || true

      - name: Step summary on failure
        if: failure()
        run: |
          echo "## ビルド失敗" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 60 build-failure/errors.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null \
            || echo "(errors.txt なし)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure
          path: build-failure
